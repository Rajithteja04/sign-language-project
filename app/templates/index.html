<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Real Time Sign Recognition</title>
  <link rel="stylesheet" href="/static/styles.css?v=20260327_1" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Real Time Sign Recognition</h1>
      <p class="subhead">Live sign detection, word recognition, and sentence formation</p>
    </header>

    <section id="modelBanner" class="banner warning">Loading model status...</section>

    <section class="toolbar card">
      <button id="startBtn" class="btn primary">Start</button>
      <button id="stopBtn" class="btn">Stop</button>
      <button id="clearBtn" class="btn warn">Clear Sentence</button>
      <span id="statusText" class="status">Ready.</span>
    </section>

    <section class="grid">
      <article class="card webcam-card">
        <h2>User Camera</h2>
        <img id="previewFeed" src="/video_feed" alt="Live Camera Feed" />
        <p id="cameraStatus" class="note">Initializing camera...</p>
      </article>

      <article class="card output-card">
        <div class="field">
          <label>Current Word</label>
          <div id="currentWord" class="value word">-</div>
        </div>

        <div class="field">
          <label>Confidence</label>
          <div class="confidence-line"><span id="confidenceValue">0.000</span></div>
          <div class="progress-wrap">
            <div id="confidenceBar" class="progress-fill low" style="width: 0%"></div>
          </div>
        </div>

        <div class="field">
          <label>Recognized Words</label>
          <div id="glossChips" class="chips"></div>
        </div>

        <div class="field">
          <label>Generated Sentence</label>
          <div id="sentenceText" class="value sentence">-</div>
        </div>

        <div class="metrics">
          <div class="metric"><span>Mode</span><strong id="modeValue">-</strong></div>
          <div class="metric"><span>Stream FPS</span><strong id="fpsValue">0.0</strong></div>
          <div class="metric"><span>Recognized Count</span><strong id="recognizedCount">0</strong></div>
          <div class="metric"><span>Decision Margin</span><strong id="marginValue">0.000</strong></div>
          <div class="metric"><span>Last Update</span><strong id="timestampValue">-</strong></div>
        </div>
      </article>
    </section>
  </main>

  <script src="/static/app.js?v=20260327_1"></script>
</body>
</html>
